[project]
name = "slackagent"
version = "0.1.0"
description = "Slack-controlled Claude Code daemon"
requires-python = ">=3.11"
dependencies = [
    # Async support is built into slack-bolt; it needs aiohttp at runtime, which
    # is why aiohttp is declared explicitly rather than via an extra.
    "slack-bolt>=1.21",
    "aiohttp>=3.9",
]

[project.scripts]
slackagent = "slackagent.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["slackagent*"]
